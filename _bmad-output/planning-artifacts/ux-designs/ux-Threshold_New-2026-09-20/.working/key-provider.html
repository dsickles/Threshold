<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Threshold — The Provider</title>
<style>
/* Governs: DESIGN.md Components provider-desk, stamp, meter, reader-view; Layout top-start slot.
   EXPERIENCE.md IA The Provider / Reflowed Reader View; Key Flow “Sam pays a bill”; State Due Date.
   Left: desk. Right: Reflowed Reader View (same file, alternate state). No pinch-zoom. */
:root {
  --surface: #1C1916;
  --ink: #F4EFE6;
  --paper: #F4EFE6;
  --ink-on-paper: #1C1916;
  --muted: #9A9084;
  --accent: #C4A574;
  --border: #3D3832;
  --approve: #2F6B4F;
  --deny: #8B3A32;
  --safe: 24px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  gap: 32px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  padding: 32px;
  background: #111;
  font-family: "Segoe UI", sans-serif;
  color: var(--ink);
}
.phone {
  width: 390px;
  height: 844px;
  border-radius: 36px;
  overflow: hidden;
  position: relative;
  border: 10px solid #2a2a2a;
  background: #2a2520;
}
.label {
  position: absolute;
  top: 8px;
  left: 0; right: 0;
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.meter {
  position: absolute;
  top: var(--safe);
  left: var(--safe);
  right: 96px;
}
.meter .row {
  display: flex;
  justify-content: space-between;
  font-family: ui-monospace, monospace;
  font-size: 16px;
  margin-bottom: 6px;
}
.track {
  height: 8px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.fill { width: 62%; height: 100%; background: var(--accent); }
.desk {
  position: absolute;
  left: 16px; right: 16px;
  top: 120px;
  bottom: 120px;
  background: #3d3832;
  border-radius: 8px;
  padding: 16px;
}
.page {
  background: var(--paper);
  color: var(--ink-on-paper);
  height: 100%;
  padding: 16px;
  font-size: 11px;
  line-height: 1.35;
}
.page h2 { margin: 0 0 8px; font-size: 13px; font-family: Georgia, serif; }
.page p { margin: 0 0 8px; }
.stamps {
  position: absolute;
  left: var(--safe);
  right: var(--safe);
  bottom: var(--safe);
  display: flex;
  gap: 12px;
}
.stamp {
  flex: 1;
  min-height: 44px;
  border-radius: 9999px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--paper);
  border: 0;
  font-size: 14px;
}
.approve { background: var(--approve); }
.deny { background: var(--deny); }
.reader {
  position: absolute;
  inset: 0;
  background: var(--paper);
  color: var(--ink-on-paper);
  padding: 72px var(--safe) var(--safe);
  font-size: 20px;
  line-height: 1.45;
}
.reader h2 {
  font-family: Georgia, serif;
  font-size: 28px;
  margin: 0 0 16px;
}
.reader p { margin: 0 0 16px; }
.dismiss {
  position: absolute;
  top: var(--safe);
  right: var(--safe);
  min-height: 44px;
  min-width: 44px;
  padding: 0 16px;
  border-radius: 8px;
  border: 1px solid #3D3832;
  background: transparent;
  color: var(--ink-on-paper);
  font-size: 16px;
}
</style>
</head>
<body>
  <div class="phone" aria-label="The Provider desk">
    <div class="meter">
      <div class="row"><span>Bank Account</span><span>$1,240</span></div>
      <div class="track"><div class="fill"></div></div>
      <div class="row" style="margin-top:8px"><span>Due Date</span><span>12</span></div>
    </div>
    <div class="desk">
      <div class="page">
        <h2>Claim 4418 — Broken arm</h2>
        <p>Facility: Riverside. Code B-19. Billed $640.</p>
        <p>EOB line: “B-91 denied. Patient share $640.”</p>
        <p>Bank draft pending. Match the code before you stamp.</p>
      </div>
    </div>
    <div class="stamps">
      <button class="stamp approve" type="button">APPROVE</button>
      <button class="stamp deny" type="button">DENY</button>
    </div>
  </div>

  <div class="phone" aria-label="Reflowed Reader View">
    <div class="reader">
      <button class="dismiss" type="button">Back</button>
      <h2>Claim 4418</h2>
      <p>Broken arm. Riverside.</p>
      <p>Billed code B-19. The explanation of benefits says B-91.</p>
    </div>
  </div>
</body>
</html>
