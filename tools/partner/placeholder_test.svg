<!-- PLACEHOLDER art for the Partner's ending: a positive pregnancy test lying
     flat, with a bold plus sign in its result window (Dan, 2026-10-20: "the
     test needs to have a plus/positive sign"). No brand. Rendered to PNG by
     tools/partner/make_images.mjs. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F6F3F0"/>
      <stop offset="1" stop-color="#DCD6D1"/>
    </linearGradient>
    <linearGradient id="wick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7EEF2"/>
      <stop offset="1" stop-color="#E2CBD6"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9D3CE"/>
      <stop offset="0.25" stop-color="#F1EDEA"/>
      <stop offset="1" stop-color="#F7F4F2"/>
    </linearGradient>
  </defs>
  <!-- The absorbent tip, on the right. -->
  <rect x="770" y="62" width="215" height="116" rx="56" fill="url(#wick)" stroke="#CDB6C2" stroke-width="3"/>
  <g stroke="#D9C2CE" stroke-width="3" stroke-linecap="round">
    <line x1="820" y1="80" x2="820" y2="160"/>
    <line x1="855" y1="74" x2="855" y2="166"/>
    <line x1="890" y1="72" x2="890" y2="168"/>
    <line x1="925" y1="74" x2="925" y2="166"/>
  </g>
  <!-- The body: a little narrower at the grip. -->
  <path d="M 70 120 C 70 70, 95 48, 150 46 L 330 52 C 380 54, 400 38, 450 36 L 790 36
           C 830 36, 850 70, 850 120 C 850 170, 830 204, 790 204 L 450 204
           C 400 202, 380 186, 330 188 L 150 194 C 95 192, 70 170, 70 120 Z"
        fill="url(#body)" stroke="#C9C1BA" stroke-width="3"/>
  <!-- Grip ridges. -->
  <g stroke="#D6CFC9" stroke-width="5" stroke-linecap="round">
    <line x1="140" y1="82" x2="140" y2="158"/>
    <line x1="170" y1="78" x2="170" y2="162"/>
    <line x1="200" y1="78" x2="200" y2="162"/>
    <line x1="230" y1="80" x2="230" y2="160"/>
  </g>
  <!-- The result window, with a bold plus. -->
  <rect x="460" y="68" width="190" height="104" rx="34" fill="url(#window)" stroke="#BEB5AE" stroke-width="3"/>
  <g fill="#D93A73">
    <rect x="543" y="84" width="24" height="72" rx="6"/>
    <rect x="519" y="108" width="72" height="24" rx="6"/>
  </g>
  <!-- The sample well. -->
  <circle cx="712" cy="120" r="24" fill="url(#window)" stroke="#BEB5AE" stroke-width="3"/>
  <!-- A soft shine along the top. -->
  <path d="M 160 60 L 330 64 C 380 66, 400 52, 450 50 L 780 50" fill="none"
        stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
</svg>
