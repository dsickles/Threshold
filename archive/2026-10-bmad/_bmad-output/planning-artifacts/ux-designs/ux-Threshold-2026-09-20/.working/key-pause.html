<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Threshold — Pause</title>
<style>
/* Governs: DESIGN.md Elevation (pause replaces, scrim), Components panel / button-primary / button-quiet, focus-ring.
   EXPERIENCE.md IA pause; State Patterns Menu focus, Tab hidden; Component Patterns pause.
   Resume is default focus. One column. Does not stack. */
:root {
  --surface: #1C1916;
  --raised: #2A2520;
  --ink: #F4EFE6;
  --accent: #C4A574;
  --border: #3D3832;
  --scrim: rgba(12,11,10,0.82);
  --md: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #111;
  font-family: "Segoe UI", sans-serif;
  color: var(--ink);
}
.phone {
  width: 390px;
  height: 844px;
  border-radius: 36px;
  overflow: hidden;
  position: relative;
  border: 10px solid #2a2a2a;
  background: #3a342c;
}
.room {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 70% 20%, #E8D4A8 0%, transparent 22%),
    linear-gradient(180deg, #4a433b, #1a1714 60%);
}
.scrim {
  position: absolute;
  inset: 0;
  background: var(--scrim);
  display: grid;
  place-items: center;
  padding: 24px;
}
.panel {
  width: min(480px, 100%);
  background: var(--raised);
  border: 1px solid var(--border);
  border-radius: var(--md);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
h1 {
  margin: 0 0 8px;
  font-family: Georgia, serif;
  font-size: 32px;
  font-weight: 600;
}
button {
  width: 100%;
  min-height: 44px;
  border-radius: var(--md);
  font-size: 16px;
  font-family: "Segoe UI", sans-serif;
}
.primary {
  background: var(--accent);
  color: var(--surface);
  border: 2px solid var(--accent);
  box-shadow: 0 0 0 2px var(--accent);
  font-weight: 600;
}
.quiet {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--border);
}
</style>
</head>
<body>
  <div class="phone" aria-label="Pause replaces the house">
    <div class="room"></div>
    <div class="scrim">
      <div class="panel">
        <h1>Paused</h1>
        <button class="primary" type="button">Resume</button>
        <button class="quiet" type="button">Settings</button>
        <button class="quiet" type="button">Back to title</button>
      </div>
    </div>
  </div>
</body>
</html>
