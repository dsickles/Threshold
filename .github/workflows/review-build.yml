# Uploads each ready-for-review PR's build to the private itch.io review page
# (https://dsickles.itch.io/threshold-review) that Hopper smoke-tests, then
# writes "itch.io build: <sha>, threshold-review" into the PR body.
# Runs here rather than in Claude threads so a thread's network rules never
# block it. Never touches the main itch.io page; that still waits for Dan's
# "upload". Skips drafts, and skips quietly until the BUTLER_API_KEY secret
# is set in the repo's GitHub settings.
name: Review build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'game/**'
      - 'tools/**'
      - '.github/workflows/review-build.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  upload-review-build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      # The PR's own head commit, not GitHub's merge preview, so the sha on
      # itch.io matches the PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/threshold-tools
            ~/.local/share/godot/export_templates
          key: godot-${{ runner.os }}-${{ hashFiles('tools/godot-setup.sh') }}

      - name: Check the itch.io key is set
        id: key
        run: |
          if [ -n "$BUTLER_API_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::BUTLER_API_KEY secret not set; review build not uploaded."; fi

      - name: Error check, tests, export and upload to the review page
        if: steps.key.outputs.ok == 'true'
        env:
          BUILD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: bash tools/publish.sh --review

      - name: Write the build line into the PR body
        if: steps.key.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          line="itch.io build: ${SHA:0:7}, threshold-review"
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body -q .body > body.md
          if grep -q '^itch\.io build:' body.md; then
            sed -i "s/^itch\.io build:.*/$line/" body.md
          else
            printf '\n%s\n' "$line" >> body.md
          fi
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --body-file body.md
