# Plays the exported web build in Chromium (tests/web/, Playwright) at laptop,
# phone and sideways-phone sizes: it loads, has no console errors, sound waits
# for the first tap, and each screen opens and goes back. Screenshots and the
# report are saved as the run's "browser-test-results" download.
# Kept apart from check.yml so the two can change without clashing.
# These complement Dan's own phone tests; they never replace them.
name: Browser tests

on:
  pull_request:
    paths:
      - 'game/**'
      - 'tools/**'
      - 'tests/web/**'
      - '.github/workflows/browser-tests.yml'
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'tools/**'
      - 'tests/web/**'
      - '.github/workflows/browser-tests.yml'

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tests/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/threshold-tools
            ~/.local/share/godot/export_templates
          key: godot-${{ runner.os }}-${{ hashFiles('tools/publish.sh') }}

      - name: Export the web build
        working-directory: .
        run: bash tools/publish.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/web/package-lock.json

      - name: Install Playwright and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npx playwright test

      - name: Save screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            tests/web/test-results/
            tests/web/playwright-report/
          retention-days: 14
